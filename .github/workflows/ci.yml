name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check release metadata and package contents
        run: node scripts/release-check.mjs

      - name: Pack and smoke-install the CLI
        shell: bash
        run: |
          package_file="$(npm pack --silent)"
          install_prefix="$RUNNER_TEMP/consistorium-smoke"
          npm install --global --prefix "$install_prefix" "./$package_file"
          "$install_prefix/bin/consistorium" version
          CONSISTORIUM_BIN="$install_prefix/bin/consistorium" node scripts/smoke-readonly.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
